spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  agent:
    recover-on-startup: ${RECOVER_INTERRUPTED_JOBS:false}
  mail:
    provider: ${MAIL_PROVIDER:gmail_api}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${FRONTEND_URL}
  password-reset:
    enabled: true
    frontend-url: ${FRONTEND_URL}
    from: ${MAIL_FROM}

ai:
  service:
    token: ${AI_SERVICE_TOKEN}
