spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gitissuesolver}
    username: ${SPRING_DATASOURCE_USERNAME:gitissuesolver}
    password: ${SPRING_DATASOURCE_PASSWORD:gitissuesolver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-ms: 86400000

github:
  token: ${GITHUB_TOKEN:}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
